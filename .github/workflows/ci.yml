name: Verify PHP application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify browser JavaScript and interaction regressions
        run: |
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
            node:24-bookworm-slim sh -ec '
              node --check public/assets/js/app.js
              node --test tests/*.test.js
            '

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build production image
        run: docker build --pull --tag dormitory-ci:${{ github.sha }} .

      - name: Validate Apache MPM configuration
        run: |
          docker run --rm --entrypoint sh dormitory-ci:${{ github.sha }} -ec '
            test -L /etc/apache2/mods-enabled/mpm_prefork.load
            test "$(find /etc/apache2/mods-enabled -maxdepth 1 -type l -name "mpm_*.load" | wc -l)" -eq 1
            apache2ctl configtest
          '

      - name: Validate runtime role dispatch fails closed
        run: |
          set +e
          docker run --rm dormitory-ci:${{ github.sha }}
          status=$?
          set -e
          test "$status" -eq 64
          set +e
          docker run --rm --env RUNTIME_ROLE=WEB dormitory-ci:${{ github.sha }}
          status=$?
          set -e
          test "$status" -eq 64

      - name: Validate Compose configuration
        env:
          APP_URL: http://localhost:8080
          APP_KEY: 5a1697717edc7dd7783c09b4c594fefa546e5aab212ae6136749002617d085f6
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing-only
          DB_ROOT_PASSWORD: testing-root-only
        run: docker compose config --quiet

      - name: Validate shell scripts
        run: |
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/bootstrap_database.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/provision_runtime_db_user.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/setup-database.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/run_monthly_billing.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/ci-initial-quota-check.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/ci-line-mysql-tests.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n scripts/ci-booking-edge-tests.sh
          docker run --rm --entrypoint bash dormitory-ci:${{ github.sha }} \
            -n database/03-runtime-grants.sh
          docker run --rm --entrypoint sh dormitory-ci:${{ github.sha }} \
            -n scripts/start-web.sh
          docker run --rm --entrypoint sh dormitory-ci:${{ github.sha }} \
            -n scripts/start-runtime.sh
          docker run --rm --entrypoint sh dormitory-ci:${{ github.sha }} \
            -n scripts/start-worker.sh

      - name: Lint PHP sources
        run: |
          docker run --rm --entrypoint sh dormitory-ci:${{ github.sha }} -c '
            find . -type f -name "*.php" -print0 |
              xargs -0 -n1 php -l >/tmp/php-lint.log || {
                cat /tmp/php-lint.log
                exit 1
              }
            echo "PHP lint passed"
          '

      - name: Run unit tests
        run: |
          docker run --rm --entrypoint php \
            -e APP_ENV=testing \
            -e APP_DEBUG=false \
            -e APP_URL=http://localhost \
            -e APP_KEY=5a1697717edc7dd7783c09b4c594fefa546e5aab212ae6136749002617d085f6 \
            -e FORCE_HTTPS=false \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=testing \
            -e DB_USERNAME=testing \
            -e DB_PASSWORD=testing-only \
            dormitory-ci:${{ github.sha }} tests/run.php
          docker run --rm --entrypoint php dormitory-ci:${{ github.sha }} \
            tests/line_bot.php

      - name: Run worker, billing CLI, and install bundle contract tests
        run: |
          docker run --rm --entrypoint php dormitory-ci:${{ github.sha }} \
            tests/notification_worker_hardening.php
          docker run --rm --entrypoint php dormitory-ci:${{ github.sha }} \
            scripts/test_generate_monthly_bills_cli.php
          docker run --rm --entrypoint php dormitory-ci:${{ github.sha }} \
            scripts/build_install_sql.php --check

      - name: Verify effective Compose runtime environment
        env:
          APP_URL: http://localhost:8080
          APP_KEY: 5a1697717edc7dd7783c09b4c594fefa546e5aab212ae6136749002617d085f6
          DB_DATABASE: compose_ci
          DB_USERNAME: compose_runtime
          DB_PASSWORD: compose-runtime-fixture-only
          DB_ROOT_PASSWORD: compose-root-fixture-only
        run: |
          set -euo pipefail
          unset BOOKING_HOLD_SECONDS RESIDENT_ACTIVATION_TTL_SECONDS WORKER_INSTANCE_ID
          docker compose --env-file /dev/null config --format json |
            docker run --rm --interactive --entrypoint php dormitory-ci:${{ github.sha }} \
              tests/compose_environment.php --defaults
          export BOOKING_HOLD_SECONDS=1800 RESIDENT_ACTIVATION_TTL_SECONDS=3600 WORKER_INSTANCE_ID=compose-ci-worker
          docker compose --env-file /dev/null config --format json |
            docker run --rm --interactive --entrypoint php dormitory-ci:${{ github.sha }} \
              tests/compose_environment.php

      - name: Exercise MySQL bootstrap, web readiness, and worker isolation
        env:
          CI_APP_KEY: 5a1697717edc7dd7783c09b4c594fefa546e5aab212ae6136749002617d085f6
          CI_DBA_PASSWORD: ci-root-password-not-for-production
          CI_DB_DATABASE: appj_ci_dormitory
          CI_DB_USERNAME: dormitory_app
          CI_DB_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -Eeuo pipefail

          image="dormitory-ci:${{ github.sha }}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="dormitory-ci-${suffix}"
          database="dormitory-db-${suffix}"
          web="dormitory-web-${suffix}"
          worker="dormitory-worker-${suffix}"

          cleanup() {
            for container in "$worker" "$web" "$database"; do
              docker rm --force "$container" >/dev/null 2>&1 || true
            done
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          report_failure() {
            local failure_status=$?
            echo "MySQL integration failed near line ${BASH_LINENO[0]} (exit ${failure_status})" >&2
            for service in "$web" "$worker"; do
              if docker inspect "$service" >/dev/null 2>&1; then
                echo "Recent logs for ${service}:" >&2
                docker logs --tail 60 "$service" >&2 || true
              fi
            done
            return "$failure_status"
          }
          trap report_failure ERR

          docker network create "$network" >/dev/null
          docker run --detach \
            --name "$database" \
            --network "$network" \
            --env MYSQL_ROOT_PASSWORD="$CI_DBA_PASSWORD" \
            --env MYSQL_ROOT_HOST=% \
            --env MYSQL_DATABASE="$CI_DB_DATABASE" \
            mysql:8.4 >/dev/null

          database_ready=false
          for attempt in $(seq 1 60); do
            if docker exec \
              --env MYSQL_PWD="$CI_DBA_PASSWORD" \
              "$database" mysqladmin ping --host=127.0.0.1 --user=root --silent; then
              database_ready=true
              break
            fi
            sleep 2
          done
          if [ "$database_ready" != true ]; then
            docker logs "$database"
            exit 1
          fi

          run_database_setup() {
            local setup_database="${1:-$CI_DB_DATABASE}"
            local setup_username="${2:-$CI_DB_USERNAME}"
            docker run --rm \
              --network "$network" \
              --entrypoint bash \
              --env RUNTIME_ROLE=job \
              --env DB_DBA_HOST="$database" \
              --env DB_DBA_PORT=3306 \
              --env DB_DBA_USERNAME=root \
              --env DB_DBA_PASSWORD="$CI_DBA_PASSWORD" \
              --env DB_HOST="$database" \
              --env DB_PORT=3306 \
              --env DB_DATABASE="$setup_database" \
              --env DB_USERNAME="$setup_username" \
              --env DB_PASSWORD="$CI_DB_PASSWORD" \
              "$image" scripts/setup-database.sh
          }

          run_database_setup
          run_database_setup

          # The single-file fresh installer must create the canonical schema
          # and must refuse a second import before changing a non-empty DB.
          docker exec --interactive \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            < database/install.sql
          install_shape="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --execute="
              SELECT CONCAT(
                (SELECT COUNT(*) FROM information_schema.tables
                  WHERE table_schema='dormitory' AND table_type='BASE TABLE'),
                '|',
                (SELECT COUNT(*) FROM information_schema.triggers
                  WHERE trigger_schema='dormitory'),
                '|',
                (SELECT COUNT(*) FROM information_schema.table_constraints
                  WHERE constraint_schema='dormitory'
                    AND constraint_type='CHECK')
              )")"
          [ "$install_shape" = '21|23|116' ]
          set +e
          docker exec --interactive \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            < database/install.sql >/tmp/ci-install-reimport.log 2>&1
          install_reimport_status=$?
          set -e
          if [ "$install_reimport_status" -eq 0 ]; then
            echo 'install.sql unexpectedly accepted a non-empty database'
            exit 1
          fi
          grep --quiet 'DORMITORY_INSTALL_ABORT_DATABASE_NOT_EMPTY' \
            /tmp/ci-install-reimport.log

          source scripts/ci-line-mysql-tests.sh

          docker run --detach \
            --name "$web" \
            --network "$network" \
            --publish 127.0.0.1:18080:8080 \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_URL=https://ci-dormitory.example.co.th \
            --env APP_TIMEZONE=Asia/Bangkok \
            --env APP_KEY="$CI_APP_KEY" \
            --env FORCE_HTTPS=true \
            --env TRUSTED_PROXIES=172.16.0.0/12 \
            --env RUNTIME_ROLE=web \
            --env PORT=8080 \
            --env DB_HOST="$database" \
            --env DB_PORT=3306 \
            --env DB_DATABASE="$CI_DB_DATABASE" \
            --env DB_USERNAME="$CI_DB_USERNAME" \
            --env DB_PASSWORD="$CI_DB_PASSWORD" \
            --env DB_SSL=false \
            "$image" >/dev/null

          web_ready=false
          for attempt in $(seq 1 60); do
            if response="$(curl --fail --silent --show-error \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18080/healthz.php 2>/dev/null)" \
              && [ "$response" = '{"status":"ok"}' ]; then
              web_ready=true
              break
            fi
            sleep 2
          done
          if [ "$web_ready" != true ]; then
            docker logs "$web"
            exit 1
          fi

          # Exercise the successful-booking quota through the real web and
          # MySQL transaction boundary. The sixth successful-looking request
          # must be denied, and that denial must commit the daily block instead
          # of being rolled back with the booking transaction.
          docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            --database="$CI_DB_DATABASE" --execute="
              INSERT INTO rooms (room_code,floor,room_type,monthly_rent,amenities)
              VALUES
                ('CI-RATE-1',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-2',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-3',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-4',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-5',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-6',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-7',1,'standard',1000.00,JSON_ARRAY()),
                ('CI-RATE-8',1,'standard',1000.00,JSON_ARRAY());"

          mapfile -t rate_room_ids < <(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT id FROM rooms WHERE room_code LIKE 'CI-RATE-%' ORDER BY room_code")
          [ "${#rate_room_ids[@]}" -eq 8 ]

          csrf="$(curl --fail --silent --show-error \
            --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:18080/api/auth/me | jq --exit-status --raw-output '.data.csrf_token')"
          for attempt in $(seq 1 6); do
            room_id="${rate_room_ids[$((attempt - 1))]}"
            phone="$(printf '08000000%02d' "$attempt")"
            body="$(printf '{\"room_id\":%s,\"full_name\":\"CI Rate %s\",\"phone\":\"%s\",\"idempotency_key\":\"ci-rate-booking-%06d\"}' \
              "$room_id" "$attempt" "$phone" "$attempt")"
            status="$(curl --silent --show-error \
              --output "/tmp/ci-rate-booking-${attempt}.json" \
              --write-out '%{http_code}' \
              --header 'X-Forwarded-Proto: https' \
              --header 'Content-Type: application/json' \
              --header 'Origin: https://ci-dormitory.example.co.th' \
              --header "X-CSRF-Token: ${csrf}" \
              --data "$body" \
              http://127.0.0.1:18080/api/public/bookings)"
            if [ "$attempt" -le 5 ]; then
              expected_status=201
            else
              expected_status=429
            fi
            if [ "$status" != "$expected_status" ]; then
              echo "Initial booking ${attempt}: expected HTTP ${expected_status}, received ${status}" >&2
              jq --compact-output '{ok,message,code:.data.code}' "/tmp/ci-rate-booking-${attempt}.json" >&2 || true
              exit 1
            fi
            if [ "$attempt" -eq 6 ]; then
              grep --quiet '"code":"RATE_LIMITED"' "/tmp/ci-rate-booking-${attempt}.json"
            fi
          done

          created_rate_bookings="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT COUNT(*) FROM bookings b JOIN rooms r ON r.id=b.room_id
              WHERE r.room_code LIKE 'CI-RATE-%'")"
          sixth_room_bookings="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT COUNT(*) FROM bookings b JOIN rooms r ON r.id=b.room_id
              WHERE r.room_code='CI-RATE-6'")"
          [ "$created_rate_bookings" = 5 ]
          [ "$sixth_room_bookings" = 0 ]

          committed_daily_block="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT COUNT(*) FROM rate_limits
              WHERE hits=6 AND blocked_until IS NOT NULL
                AND TIMESTAMPDIFF(SECOND,UTC_TIMESTAMP(),blocked_until)>80000")"
          bash scripts/ci-initial-quota-check.sh "$database" "$committed_daily_block"

          # Reset only the disposable CI buckets. Two invalid requests plus a
          # calibration booking reveal the successful-IP bucket without
          # depending on Docker's bridge address (the phone bucket can be
          # derived from the known CI APP_KEY).
          docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            --database="$CI_DB_DATABASE" --execute="DELETE FROM rate_limits"

          for attempt in $(seq 1 2); do
            body="$(printf '{\"room_id\":999999,\"full_name\":\"CI Calibration\",\"phone\":\"08770000%02d\",\"idempotency_key\":\"ci-invalid-calibration-%06d\"}' \
              "$attempt" "$attempt")"
            status="$(curl --silent --show-error --output /tmp/ci-invalid-calibration.json \
              --write-out '%{http_code}' --header 'Content-Type: application/json' \
              --header 'X-Forwarded-Proto: https' \
              --header 'Origin: https://ci-dormitory.example.co.th' \
              --header "X-CSRF-Token: ${csrf}" --data "$body" \
              http://127.0.0.1:18080/api/public/bookings)"
            [ "$status" = 404 ]
          done

          calibration_body="$(printf '{\"room_id\":%s,\"full_name\":\"CI Calibration\",\"phone\":\"0877777777\",\"idempotency_key\":\"ci-calibration-000001\"}' \
            "${rate_room_ids[5]}")"
          calibration_status="$(curl --silent --show-error \
            --output /tmp/ci-calibration.json --write-out '%{http_code}' \
            --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://ci-dormitory.example.co.th' \
            --header "X-CSRF-Token: ${csrf}" --data "$calibration_body" \
            http://127.0.0.1:18080/api/public/bookings)"
          [ "$calibration_status" = 201 ]

          calibration_phone_bucket="$(docker exec "$web" php -r \
            'echo hash_hmac("sha256","public-booking-phone:0877777777",(string)getenv("APP_KEY"));')"
          success_ip_bucket="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT bucket_key FROM rate_limits
              WHERE hits=1 AND bucket_key<>'${calibration_phone_bucket}'")"
          [ "${#calibration_phone_bucket}" -eq 64 ]
          [ "${#success_ip_bucket}" -eq 64 ]

          docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            --database="$CI_DB_DATABASE" --execute="
              UPDATE bookings
              SET status='cancelled',cancelled_at=UTC_TIMESTAMP(),
                  cancel_reason='CI calibration transition',updated_at=UTC_TIMESTAMP()
              WHERE idempotency_key='ci-calibration-000001' AND status='pending';
              DELETE FROM rate_limits WHERE bucket_key<>'${success_ip_bucket}';
              UPDATE rate_limits SET hits=0,blocked_until=NULL,
                  window_started_at=UTC_TIMESTAMP(),updated_at=UTC_TIMESTAMP()
              WHERE bucket_key='${success_ip_bucket}';"

          # Hold the successful-IP row while two different phone/room
          # transactions pass their initial idempotency reads. Releasing this
          # row makes one insert win and forces the other through the late
          # duplicate-key BOOKING_RETRY path, where its quota must roll back.
          docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="START TRANSACTION;
              SELECT bucket_key FROM rate_limits
              WHERE bucket_key='${success_ip_bucket}' FOR UPDATE;
              DO SLEEP(8); COMMIT;" >/tmp/ci-success-ip-lock.log &
          success_ip_lock_pid=$!
          sleep 1

          concurrent_body_a="$(printf '{\"room_id\":%s,\"full_name\":\"CI Concurrent\",\"phone\":\"0888888888\",\"idempotency_key\":\"ci-concurrent-key-000001\"}' \
            "${rate_room_ids[5]}")"
          concurrent_body_b="$(printf '{\"room_id\":%s,\"full_name\":\"CI Concurrent\",\"phone\":\"0866666666\",\"idempotency_key\":\"ci-concurrent-key-000001\"}' \
            "${rate_room_ids[6]}")"
          curl --silent --show-error \
            --output /tmp/ci-concurrent-a.json --write-out '%{http_code}' \
            --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://ci-dormitory.example.co.th' \
            --header "X-CSRF-Token: ${csrf}" --data "$concurrent_body_a" \
            http://127.0.0.1:18080/api/public/bookings >/tmp/ci-concurrent-a.status &
          concurrent_pid_a=$!
          curl --silent --show-error \
            --output /tmp/ci-concurrent-b.json --write-out '%{http_code}' \
            --header 'X-Forwarded-Proto: https' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://ci-dormitory.example.co.th' \
            --header "X-CSRF-Token: ${csrf}" --data "$concurrent_body_b" \
            http://127.0.0.1:18080/api/public/bookings >/tmp/ci-concurrent-b.status &
          concurrent_pid_b=$!
          wait "$concurrent_pid_a"
          wait "$concurrent_pid_b"
          wait "$success_ip_lock_pid"
          concurrent_statuses="$(cat /tmp/ci-concurrent-a.status):$(cat /tmp/ci-concurrent-b.status)"
          case "$concurrent_statuses" in
            201:409|409:201) ;;
            *)
              echo "Unexpected concurrent booking statuses: $concurrent_statuses"
              jq --compact-output '{ok,message,code:.data.code}' \
                /tmp/ci-concurrent-a.json /tmp/ci-concurrent-b.json || true
              exit 1
              ;;
          esac
          if ! grep --quiet '"code":"BOOKING_RETRY"' \
              /tmp/ci-concurrent-a.json /tmp/ci-concurrent-b.json; then
            echo 'Concurrent loser did not use the rollback-safe BOOKING_RETRY path'
            jq --compact-output '{ok,message,code:.data.code}' \
              /tmp/ci-concurrent-a.json /tmp/ci-concurrent-b.json || true
            exit 1
          fi

          concurrent_booking_count="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT COUNT(*) FROM bookings
              WHERE idempotency_key='ci-concurrent-key-000001'")"
          concurrent_bucket_shape="$(docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --batch --skip-column-names \
            --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
            --execute="SELECT CONCAT(COUNT(*),'|',SUM(hits=1),'|',SUM(hits=2))
              FROM rate_limits")"
          [ "$concurrent_booking_count" = 1 ]
          if [ "$concurrent_bucket_shape" != '4|2|1' ]; then
            echo "Unexpected concurrent quota bucket shape: $concurrent_bucket_shape"
            docker exec \
              --env MYSQL_PWD="$CI_DBA_PASSWORD" \
              "$database" mysql --batch --skip-column-names \
              --host=127.0.0.1 --user=root --database="$CI_DB_DATABASE" \
              --execute="SELECT hits,blocked_until IS NOT NULL FROM rate_limits ORDER BY hits,bucket_key"
            exit 1
          fi

          bash scripts/ci-booking-edge-tests.sh cross "$database" "$csrf" "${rate_room_ids[5]}" "${rate_room_ids[6]}" "${rate_room_ids[7]}"

          docker exec \
            --env MYSQL_PWD="$CI_DBA_PASSWORD" \
            "$database" mysql --host=127.0.0.1 --user=root \
            --database="$CI_DB_DATABASE" --execute="
              UPDATE bookings
              SET status='cancelled',cancelled_at=UTC_TIMESTAMP(),
                  cancel_reason='CI concurrency transition',updated_at=UTC_TIMESTAMP()
              WHERE idempotency_key IN
                ('ci-concurrent-key-000001','ci-cross-expired-new-000001')
                AND status='pending';
              DELETE FROM rate_limits;"

          bash scripts/ci-booking-edge-tests.sh phone "$database" "$csrf" "${rate_room_ids[5]}" "${rate_room_ids[6]}" "${rate_room_ids[7]}"

          bash scripts/ci-booking-edge-tests.sh post "$database" "$csrf" "${rate_room_ids[5]}" "${rate_room_ids[6]}" "${rate_room_ids[7]}" "$web"

          # Validate production configuration/schema while allowing expected
          # fresh-install readiness warnings (owner/integrations are added by
          # deployment steps after bootstrap).
          docker exec "$web" php scripts/check_requirements.php --db

          docker run --detach \
            --name "$worker" \
            --network "$network" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_URL=https://ci-dormitory.example.co.th \
            --env APP_TIMEZONE=Asia/Bangkok \
            --env APP_KEY="$CI_APP_KEY" \
            --env FORCE_HTTPS=true \
            --env RUNTIME_ROLE=worker \
            --env DB_HOST="$database" \
            --env DB_PORT=3306 \
            --env DB_DATABASE="$CI_DB_DATABASE" \
            --env DB_USERNAME="$CI_DB_USERNAME" \
            --env DB_PASSWORD="$CI_DB_PASSWORD" \
            --env DB_SSL=false \
            "$image" >/dev/null

          sleep 5
          [ "$(docker inspect --format '{{.State.Running}}' "$worker")" = true ]
          [ "$(docker exec --user 0 "$worker" awk '/^Uid:/{print $2}' /proc/1/status)" = 33 ]
          [ "$(docker exec --user 0 "$worker" awk '/^Gid:/{print $2}' /proc/1/status)" = 33 ]
