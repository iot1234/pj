x-runtime-common: &runtime-common
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?Set the public HTTPS APP_URL in .env}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  FORCE_HTTPS: ${FORCE_HTTPS:-true}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  SESSION_NAME: ${SESSION_NAME:-dormitory_session}
  SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-43200}
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SSL: ${DB_SSL:-false}
  DB_SSL_CA: ${DB_SSL_CA:-}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *runtime-common
      RUNTIME_ROLE: web
    ports:
      # Keep the plain-HTTP container port on the local host. Production TLS
      # terminates at a reverse proxy that forwards from a TRUSTED_PROXIES IP.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: www-data
    environment:
      <<: *runtime-common
      RUNTIME_ROLE: worker
    command: ["sh", "scripts/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Bangkok
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ZERO_DATE,NO_ZERO_IN_DATE,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/defaults.sql:/docker-entrypoint-initdb.d/02-defaults.sql:ro
      - ./database/03-runtime-grants.sh:/docker-entrypoint-initdb.d/03-runtime-grants.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  app_storage:
