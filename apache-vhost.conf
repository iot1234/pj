ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks -MultiViews
        # Permit only the two defensive Options toggles used by public/.htaccess.
        # Apache 2.4.68 rejects MultiViews unless it is named explicitly here.
        AllowOverride FileInfo AuthConfig Options=Indexes,MultiViews
        Require all granted
    </Directory>

    <Directory /var/www/html/storage>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    LimitRequestBody 5242880
    TraceEnable Off
    ServerSignature Off

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
